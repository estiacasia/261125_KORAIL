{% extends "base.html" %}
{% block title %}주소록·프로젝트 · 이메일·공지문 템플릿 생성기{% endblock %}
{% block lead %}생성기의 수신자명·프로젝트명 자동완성에 쓰입니다. 수신자를 고르면 이메일과 기본 수신 대상이 함께 채워집니다.{% endblock %}
{% block content %}
<div class="page">
  <section class="card panel">
    <h2 class="t">주소록</h2>
    <div class="tablewrap">
      <table class="grid">
        <thead><tr><th>이름·호칭</th><th>회사</th><th>이메일</th><th>기본 수신 대상</th><th>사용</th><th></th></tr></thead>
        <tbody id="cBody"></tbody>
        <tfoot><tr>
          <td><input id="nName" placeholder="예: 김민수 팀장님" maxlength="50" aria-label="새 이름"></td>
          <td><input id="nCompany" placeholder="회사" maxlength="100" aria-label="새 회사"></td>
          <td><input id="nEmail" type="email" placeholder="name@company.com" maxlength="200" aria-label="새 이메일"></td>
          <td><select id="nAud" aria-label="새 기본 수신 대상"><option value="">지정 안 함</option><option value="ext">외부 거래처</option><option value="dept">타 부서 협업</option><option value="team">사내 팀원</option></select></td>
          <td></td>
          <td><button class="btn" type="button" id="cAdd">추가</button></td>
        </tr></tfoot>
      </table>
    </div>
  </section>
  <section class="card panel">
    <h2 class="t">프로젝트</h2>
    <div class="tablewrap">
      <table class="grid">
        <thead><tr><th>프로젝트명</th><th>보관</th><th>사용</th><th></th></tr></thead>
        <tbody id="pBody"></tbody>
        <tfoot><tr>
          <td><input id="pName" placeholder="예: 2027 브랜드 리뉴얼" maxlength="100" aria-label="새 프로젝트명"></td>
          <td></td><td></td>
          <td><button class="btn" type="button" id="pAdd">추가</button></td>
        </tr></tfoot>
      </table>
    </div>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script>
(function () {
  const { $, api, toast, esc } = App;
  const AUD = [['', '지정 안 함'], ['ext', '외부 거래처'], ['dept', '타 부서 협업'], ['team', '사내 팀원']];
  async function loadContacts() {
    const { items } = await api('GET', '/api/contacts?all=1');
    $('cBody').innerHTML = items.length ? items.map(c => `<tr data-id="${c.id}">
      <td><input data-f="display_name" value="${esc(c.display_name)}" maxlength="50" aria-label="이름"></td>
      <td><input data-f="company" value="${esc(c.company || '')}" maxlength="100" aria-label="회사"></td>
      <td><input data-f="email" type="email" value="${esc(c.email || '')}" maxlength="200" aria-label="이메일"></td>
      <td><select data-f="default_audience" aria-label="기본 수신 대상">${AUD.map(([v, l]) => `<option value="${v}"${(c.default_audience || '') === v ? ' selected' : ''}>${l}</option>`).join('')}</select></td>
      <td class="muted">${c.use_count}회</td>
      <td><div class="btns"><button class="mini" data-save>저장</button><button class="mini" data-del>삭제</button></div></td></tr>`).join('')
      : '<tr><td colspan="6" class="muted">등록된 수신자가 없습니다.</td></tr>';
  }
  async function loadProjects() {
    const { items } = await api('GET', '/api/projects?all=1');
    $('pBody').innerHTML = items.length ? items.map(p => `<tr data-id="${p.id}">
      <td><input data-f="name" value="${esc(p.name)}" maxlength="100" aria-label="프로젝트명"></td>
      <td><label class="chk"><input type="checkbox" data-f="is_archived"${p.is_archived ? ' checked' : ''}> 보관</label></td>
      <td class="muted">${p.use_count}회</td>
      <td><div class="btns"><button class="mini" data-save>저장</button><button class="mini" data-del>삭제</button></div></td></tr>`).join('')
      : '<tr><td colspan="4" class="muted">등록된 프로젝트가 없습니다.</td></tr>';
  }
  const rowData = tr => { const d = {}; tr.querySelectorAll('[data-f]').forEach(i => { d[i.dataset.f] = i.type === 'checkbox' ? i.checked : i.value; }); return d; };
  function bindTable(tbody, base, reload, label) {
    tbody.addEventListener('click', async e => {
      const b = e.target.closest('button'); if (!b) return; const tr = b.closest('tr');
      try {
        if ('save' in b.dataset) { await api('PUT', `${base}/${tr.dataset.id}`, rowData(tr)); toast(`${label}을(를) 저장했습니다.`); }
        else if ('del' in b.dataset) { if (!confirm('삭제할까요?')) return; await api('DELETE', `${base}/${tr.dataset.id}`); toast('삭제했습니다.'); }
        reload();
      } catch (err) { toast(err.message); }
    });
  }
  bindTable($('cBody'), '/api/contacts', loadContacts, '수신자');
  bindTable($('pBody'), '/api/projects', loadProjects, '프로젝트');
  $('cAdd').addEventListener('click', async () => {
    try {
      await api('POST', '/api/contacts', { display_name: $('nName').value, company: $('nCompany').value, email: $('nEmail').value, default_audience: $('nAud').value || null });
      ['nName', 'nCompany', 'nEmail'].forEach(id => { $(id).value = ''; }); $('nAud').value = '';
      toast('수신자를 추가했습니다.'); loadContacts();
    } catch (err) { toast(err.message); }
  });
  $('pAdd').addEventListener('click', async () => {
    try { await api('POST', '/api/projects', { name: $('pName').value }); $('pName').value = ''; toast('프로젝트를 추가했습니다.'); loadProjects(); }
    catch (err) { toast(err.message); }
  });
  loadContacts().catch(e => toast(e.message)); loadProjects().catch(e => toast(e.message));
})();
</script>
{% endblock %}
